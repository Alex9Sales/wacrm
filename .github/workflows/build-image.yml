name: Build & push CRM Fluxia image

# Builds the Docker image OFF the production VPS (GitHub-hosted runner) and
# pushes it to GHCR. Coolify then only PULLS the prebuilt image — no build
# load on the 2-vCPU production box.

on:
  push:
    branches: [fluxia/core]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch: {}

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/alex9sales/crm-fluxia
  SITE_URL: https://crm.salestecnologia.com.br

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
          tags: |
            ${{ env.IMAGE }}:fluxia-core
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tell Coolify to PULL the just-pushed image and redeploy both apps
      # (web + worker). Without this, Coolify never learns a new image
      # exists and the running containers stay on the old build until a
      # manual `docker compose pull && up -d`. The UUIDs are the Coolify
      # application ids (== the /data/coolify/applications/<uuid> dir names).
      # Safe no-op until the COOLIFY_TOKEN repo secret is added.
      - name: Trigger Coolify redeploy (web + worker)
        if: success()
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "COOLIFY_TOKEN not set — skipping auto-deploy."
            echo "Add the repo secret (Settings → Secrets → Actions → COOLIFY_TOKEN) to enable."
            exit 0
          fi
          curl -fsS -X GET \
            "https://coolify.salestecnologia.com.br/api/v1/deploy?uuid=klqgmh23eh0mi72r6scqtdo2,i9edhxtdkqf5gi8b12zh2j0h&force=true" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
          && echo "✓ Coolify deploy triggered for web + worker."
