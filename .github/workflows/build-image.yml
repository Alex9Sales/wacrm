name: Build & push CRM Fluxia image

# Builds the Docker image OFF the production VPS (GitHub-hosted runner) and
# pushes it to GHCR. Coolify then only PULLS the prebuilt image — no build
# load on the 2-vCPU production box.

on:
  push:
    branches: [fluxia/core]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch: {}

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/alex9sales/crm-fluxia
  SITE_URL: https://crm.salestecnologia.com.br

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
          tags: |
            ${{ env.IMAGE }}:fluxia-core
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy over SSH: pull the just-pushed image and recreate both apps
      # (web + worker). Replaces the flaky Coolify /api/v1/deploy trigger
      # (timed out OR returned OK-but-didn't-pull repeatedly). The SSH key
      # (VPS_DEPLOY_SSH_KEY secret) is LOCKED on the VPS to a forced command
      # in authorized_keys — it can ONLY run /root/deploy-crm.sh (docker pull
      # + compose up --force-recreate for both apps), no shell, no arbitrary
      # commands. SSH (22) is already open; no firewall/port change. Coolify
      # still owns the apps — this just does the same recreate it would.
      - name: Deploy via SSH (pull + recreate web + worker)
        if: success()
        env:
          VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$VPS_DEPLOY_SSH_KEY" ]; then
            echo "VPS_DEPLOY_SSH_KEY not set — skipping auto-deploy."
            echo "Image IS pushed to GHCR; deploy manually with docker compose pull && up -d."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key (no blind accept-new → no MITM on first connect).
          ssh-keyscan -t ed25519 72.60.137.234 >> ~/.ssh/known_hosts 2>/dev/null
          # The forced command on the VPS ignores this arg and runs the deploy.
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=yes root@72.60.137.234 deploy
