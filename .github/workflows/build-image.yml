name: Build & push CRM Fluxia image

# Builds the Docker image OFF the production VPS (GitHub-hosted runner) and
# pushes it to GHCR. Coolify then only PULLS the prebuilt image — no build
# load on the 2-vCPU production box.

on:
  push:
    branches: [fluxia/core]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch: {}

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/alex9sales/crm-fluxia
  SITE_URL: https://crm.salestecnologia.com.br

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
          tags: |
            ${{ env.IMAGE }}:fluxia-core
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy over SSH: pull the just-pushed image and recreate both apps
      # (web + worker). Replaces the flaky Coolify /api/v1/deploy trigger
      # (timed out OR returned OK-but-didn't-pull repeatedly). We invoke the
      # deploy script by its ABSOLUTE PATH (/root/deploy-crm.sh: docker pull +
      # compose up --force-recreate for both apps). This is forward-compatible
      # with hardening: if the VPS key is later LOCKED to a forced command in
      # authorized_keys, sshd ignores this arg and runs the script anyway.
      # SSH (22) is already open; no firewall/port change. Coolify still owns
      # the apps — this just does the same recreate it would.
      - name: Deploy via SSH (pull + recreate web + worker)
        if: success()
        env:
          VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$VPS_DEPLOY_SSH_KEY" ]; then
            echo "VPS_DEPLOY_SSH_KEY not set — skipping auto-deploy."
            echo "Image IS pushed to GHCR; deploy manually with docker compose pull && up -d."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key (no blind accept-new → no MITM on first connect).
          ssh-keyscan -t ed25519 72.60.137.234 >> ~/.ssh/known_hosts 2>/dev/null
          # Retry: the deploy fires right after the push, so the VPS's
          # `docker pull` can briefly race GHCR (fresh manifest not yet
          # available) and fail fast with `set -e`. A couple of retries makes
          # the auto-deploy robust instead of needing a manual re-run.
          n=0
          until [ "$n" -ge 3 ]; do
            if ssh -i ~/.ssh/deploy_key -o ConnectTimeout=20 \
                 -o StrictHostKeyChecking=yes root@72.60.137.234 /root/deploy-crm.sh; then
              echo "[deploy] succeeded on attempt $((n + 1))"
              exit 0
            fi
            n=$((n + 1))
            echo "[deploy] attempt $n failed; retrying in 20s..."
            sleep 20
          done
          echo "[deploy] all attempts failed"
          exit 1
